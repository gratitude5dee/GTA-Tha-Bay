name: preview

# One Workers Preview of the staging Worker per same-repo pull request (fork PRs have no secrets).
# Prerequisite: the operator ran `pnpm deploy:bootstrap` once so tha-bay-web-staging exists.
# Do not also connect Workers Builds to this repository: every push would deploy twice.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      # BD-FIX-CI10-P01: this job launches both engines.
      DV_PW_BROWSERS: 'chromium webkit'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BD-PW-01: the Preview is a QA build WITH the offline `synth` world, so the owner sees the streamed city (open /?tier=desktop).
      # Same restore-or-build step and key as ci.yml (M02b1), so the cache entry is shared with the CI jobs. Only this workflow:
      # deploy.yml (staging, production) builds without DV_WORLD; the real-world release to staging is M02c2.
      # actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - run: pnpm build
        env:
          VITE_DV_QA: '1'
          DV_WORLD: synth
      # F-018: Workers static assets allow 25 MiB per file and 20,000 files per version; fails with the offending numbers.
      - run: pnpm exec tsx tools/ci/check-dist.ts limits
      - name: The Preview build carries the world (media-local packs and the world index)
        run: |
          test -n "$(find apps/web/dist/media-local -type f -name '*.pack' -print -quit)" || { echo "::error::apps/web/dist/media-local holds no world pack; DV_WORLD=synth did not take effect"; exit 1; }
          key=$(jq -r .key apps/web/dist/asset-catalog.json)
          grep -q '"data/world-index"' "apps/web/dist/media-local/$key" || { echo "::error::the catalog manifest apps/web/dist/media-local/$key has no data/world-index"; exit 1; }
      - run: pnpm deploy:preview
        env:
          # Staging's secrets.required applies to Previews; the secrets ride with the Preview (tools/ci/deploy.ts previewCommands, BD-FIX-CI5-S02).
          PLAY_TOKEN_HMAC: ${{ secrets.PLAY_TOKEN_HMAC }}
          PLAY_TOKEN_HMAC_PREV: ${{ secrets.PLAY_TOKEN_HMAC_PREV }}
          QUOTA_NET_SALT_SECRET: ${{ secrets.QUOTA_NET_SALT_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # BD-FIX-CI10-P01, keyed per package set by BD-FU-B05: the browsers in DV_PW_BROWSERS and their system packages through
      # tools/ci/pw-install.ts. On some runners the Azure Ubuntu mirror serves package files at about 42 kB/s (run 40017655149: perf
      # cancelled at 45 min in this step, two shards 47 min). The script skips apt when nothing is missing, prefetches in apt
      # download-only mode in time-boxed attempts (the second on the rotated mirror list, archive.ubuntu.com first), then runs
      # `playwright install --with-deps` as before; its exit status is the step's. The apt archives are cached under one stable key per
      # package set (runner OS and arch, Ubuntu release, Playwright version, engines), shared by every job and run that installs that
      # set: a complete set is saved once, only when the restore was not an exact hit (caches are immutable; the default branch's are
      # restored on every branch). A failed or cancelled install keeps its downloads in a per-job `-partial-` cache, which the next
      # restore picks up by prefix. A refused save never fails the job (spec/03 section 6).
      - id: pw-key
        name: Apt cache key of this package set
        run: pnpm exec tsx tools/ci/pw-install.ts --cache-key $DV_PW_BROWSERS
      - id: pw-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dv-pw-apt/*.deb
          key: ${{ steps.pw-key.outputs.key }}
          restore-keys: |
            ${{ steps.pw-key.outputs.key }}-
            ${{ steps.pw-key.outputs.base }}
      - id: pw-install
        name: Playwright browsers and their system packages
        run: pnpm exec tsx tools/ci/pw-install.ts $DV_PW_BROWSERS
      - id: pw-apt-new
        name: New apt archives since the restore
        if: always()
        run: pnpm exec tsx tools/ci/pw-install.ts --count-new
      - name: Save the complete package set (once per key)
        if: always() && steps.pw-install.outcome == 'success' && steps.pw-apt.outputs.cache-hit != 'true' && fromJSON(steps.pw-apt-new.outputs.new || '0') > 0
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dv-pw-apt/*.deb
          key: ${{ steps.pw-apt.outputs.cache-primary-key }}
      - name: Save the downloads of a failed or cancelled install
        if: always() && (steps.pw-install.outcome == 'failure' || steps.pw-install.outcome == 'cancelled') && fromJSON(steps.pw-apt-new.outputs.new || '0') > 0
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dv-pw-apt/*.deb
          key: ${{ steps.pw-apt.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
      - run: pnpm check:headers -- --from test-results/preview-url.txt
      - run: pnpm check:coi -- --from test-results/preview-url.txt
      - name: Comment the Preview URL
        run: |
          if [ -f test-results/preview-url.txt ]; then
            body="Preview: $(cat test-results/preview-url.txt)"
            gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
          else
            echo "No preview URL (deploy:preview skipped); no comment."
          fi

  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the Preview
        # A Preview made by the versions-upload fallback has nothing to delete, so a failure here is not fatal.
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "SKIP preview cleanup: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not set"
            exit 0
          fi
          pnpm --filter @dv/edge exec wrangler preview delete --env staging --name "pr-$PR_NUMBER" --skip-confirmation

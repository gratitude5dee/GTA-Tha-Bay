name: preview

# One Workers Preview of the staging Worker per same-repo pull request (fork PRs have no secrets).
# Prerequisite: the operator ran `pnpm deploy:bootstrap` once so tha-bay-web-staging exists.
# Do not also connect Workers Builds to this repository: every push would deploy twice.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_DV_QA: '1'
      - run: pnpm deploy:preview
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm check:headers -- --from test-results/preview-url.txt
      - run: pnpm check:coi -- --from test-results/preview-url.txt
      - name: Comment the Preview URL
        run: |
          if [ -f test-results/preview-url.txt ]; then
            body="Preview: $(cat test-results/preview-url.txt)"
            gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
          else
            echo "No preview URL (deploy:preview skipped); no comment."
          fi

  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the Preview
        # A Preview made by the versions-upload fallback has nothing to delete, so a failure here is not fatal.
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "SKIP preview cleanup: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not set"
            exit 0
          fi
          pnpm --filter @dv/edge exec wrangler preview delete --env staging --name "pr-$PR_NUMBER" --skip-confirmation

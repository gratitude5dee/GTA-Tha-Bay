name: deploy

# push to main        -> tha-bay-web-staging  (pnpm deploy:prod -- --env staging)
# tag v* / manual run -> tha-bay-web (production), only when github.actor is in the repository variable DEPLOY_ALLOWED_ACTORS
#
# Private personal repositories cannot enforce environment reviewers (research/gap-ci-cd-release-assets.md section 6),
# so the allowlist is checked in the job. A missing Cloudflare secret fails the job on purpose: a silent skip would hide
# a broken pipeline. Prerequisite: the operator ran `pnpm deploy:bootstrap` once so both Workers exist.
# Do not also connect Workers Builds to this repository: every push would deploy twice.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned by commit SHA, as in ci.yml.

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pin the smoke target: wrangler output echoes HOST_* vars, so parsing it is nondeterministic.
      SMOKE_URL: https://tha-bay-web-staging.gratitude-8f4.workers.dev
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions upload, 0 % smoke, 100 %, rollback on failure
        run: pnpm deploy:prod -- --env staging

  production:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ALLOWED_ACTORS: ${{ vars.DEPLOY_ALLOWED_ACTORS }}
      ACTOR: ${{ github.actor }}
      SMOKE_URL: https://tha-bay-web.gratitude-8f4.workers.dev
    steps:
      - name: Check the actor against DEPLOY_ALLOWED_ACTORS
        run: |
          if [ -z "$DEPLOY_ALLOWED_ACTORS" ]; then
            echo "::error::repository variable DEPLOY_ALLOWED_ACTORS is not set; production deploys are refused"
            exit 1
          fi
          allowed=0
          for a in $(echo "$DEPLOY_ALLOWED_ACTORS" | tr ',' ' '); do
            if [ "$a" = "$ACTOR" ]; then allowed=1; fi
          done
          if [ "$allowed" != "1" ]; then
            echo "::error::$ACTOR is not in DEPLOY_ALLOWED_ACTORS"
            exit 1
          fi
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions upload, 0 % smoke, 100 %, rollback on failure
        run: pnpm deploy:prod

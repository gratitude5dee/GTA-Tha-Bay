name: deploy

# push to main        -> tha-bay-web-staging  (pnpm deploy:prod -- --env staging)
# tag v* / manual run -> tha-bay-web (production), only when github.actor is in the repository variable DEPLOY_ALLOWED_ACTORS
#
# Private personal repositories cannot enforce environment reviewers (research/gap-ci-cd-release-assets.md section 6),
# so the allowlist is checked in the job. A missing Cloudflare secret fails the job on purpose: a silent skip would hide
# a broken pipeline. Prerequisite: the operator ran `pnpm deploy:bootstrap` once so both Workers exist.
# Do not also connect Workers Builds to this repository: every push would deploy twice.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base:
        description: 'Commit or tag the deployed Worker was last built from (decides wrangler deploy vs versions upload for a Durable Object lifecycle change); empty = the previous v* tag, else the parent'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned by commit SHA, as in ci.yml.

jobs:
  # M05d: migrations before the Worker (expand-only, so the old Worker keeps working against the new schema). `pnpm db:push` prints the
  # dry-run listing to the job summary, then pushes; with the token, project id or password missing it prints one SKIP line and passes.
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push migrations to the staging project
        run: pnpm db:push -- --env staging

  migrate-production:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
      DEPLOY_ALLOWED_ACTORS: ${{ vars.DEPLOY_ALLOWED_ACTORS }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Check the actor against DEPLOY_ALLOWED_ACTORS
        run: |
          allowed=0
          for a in $(echo "$DEPLOY_ALLOWED_ACTORS" | tr ',' ' '); do
            if [ "$a" = "$ACTOR" ]; then allowed=1; fi
          done
          if [ "$allowed" != "1" ]; then
            echo "::error::$ACTOR is not in DEPLOY_ALLOWED_ACTORS"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push migrations to the production project
        run: pnpm db:push -- --env prod

  staging:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pin the smoke target: wrangler output echoes HOST_* vars, so parsing it is nondeterministic.
      SMOKE_URL: https://tha-bay-web-staging.gratitude-8f4.workers.dev
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # deploy:prod --auto-lifecycle diffs against the previously deployed commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions upload (wrangler deploy for a Durable Object lifecycle change), 0 % smoke, 100 %, rollback on failure
        env:
          DV_EVENT_BEFORE: ${{ github.event.before }}
          DV_DEPLOY_BASE: ${{ inputs.base }}
          # Worker secrets ride with the version (tools/ci/deploy.ts buildSecretsJson, DL-679; M06a1).
          PLAY_TOKEN_HMAC: ${{ secrets.PLAY_TOKEN_HMAC }}
          PLAY_TOKEN_HMAC_PREV: ${{ secrets.PLAY_TOKEN_HMAC_PREV }}
          QUOTA_NET_SALT_SECRET: ${{ secrets.QUOTA_NET_SALT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm deploy:prod -- --env staging --auto-lifecycle
      # M05d: the two routes every client calls first, on the staging host, after the deploy.
      - name: Staging smoke suite
        run: pnpm test:staging -- smoke

  production:
    needs: migrate-production
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ALLOWED_ACTORS: ${{ vars.DEPLOY_ALLOWED_ACTORS }}
      ACTOR: ${{ github.actor }}
      SMOKE_URL: https://tha-bay-web.gratitude-8f4.workers.dev
    steps:
      - name: Check the actor against DEPLOY_ALLOWED_ACTORS
        run: |
          if [ -z "$DEPLOY_ALLOWED_ACTORS" ]; then
            echo "::error::repository variable DEPLOY_ALLOWED_ACTORS is not set; production deploys are refused"
            exit 1
          fi
          allowed=0
          for a in $(echo "$DEPLOY_ALLOWED_ACTORS" | tr ',' ' '); do
            if [ "$a" = "$ACTOR" ]; then allowed=1; fi
          done
          if [ "$allowed" != "1" ]; then
            echo "::error::$ACTOR is not in DEPLOY_ALLOWED_ACTORS"
            exit 1
          fi
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # deploy:prod --auto-lifecycle diffs against the previously deployed commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions upload (wrangler deploy for a Durable Object lifecycle change), 0 % smoke, 100 %, rollback on failure
        env:
          DV_EVENT_BEFORE: ${{ github.event.before }}
          DV_DEPLOY_BASE: ${{ inputs.base }}
          # Worker secrets ride with the version (tools/ci/deploy.ts buildSecretsJson, DL-679; M06a1).
          PLAY_TOKEN_HMAC: ${{ secrets.PLAY_TOKEN_HMAC }}
          PLAY_TOKEN_HMAC_PREV: ${{ secrets.PLAY_TOKEN_HMAC_PREV }}
          QUOTA_NET_SALT_SECRET: ${{ secrets.QUOTA_NET_SALT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm deploy:prod -- --auto-lifecycle

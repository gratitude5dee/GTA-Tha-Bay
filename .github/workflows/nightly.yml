name: nightly

# Nightly checks that must not block pull requests (M00b):
#  - genai:liveness: every fal endpoint in config/genai-endpoints.json against fal's public registry, no key.
#    A failure here is an issue to read, not a PR failure.
#  - legal:snapshot --verify: stored vendor-terms hashes against docs/legal/vendor-terms/index.json (offline).
#  - ScanCode Toolkit and `reuse lint`: reported only, and only when installed (their versions are not in the ledger).
# M02b1 additions: the synth and civic-excerpt bakes are restored or built before the e2e, determinism and perf jobs; the full e2e runs
# twice (the gray-box tags on a build without a world, the rest on DV_WORLD=synth); determinism and `check:perf -- --fail` run on DV_WORLD=synth.
# M02a2 addition: `map:build -- --area synth` then `map:verify -- --area synth` (graph connectivity, signals, routes, limits, transit).
# M00d additions: the full e2e matrix (including @quarantine), the cross-browser determinism suites, `check:perf -- --fail`
# (job perf), the stale-Preview sweep and an informational macOS probe.

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same string as ci.yml and tests/e2e/graybox-grep.txt (M02b1, DL-546, DL-680).
  GRAYBOX_GREP: '@graybox|@pack-|@touch|@vehicle( |$)|@boot|@fp-tp|@perf-meter|@ui-hud|@modes( |$)'

# Actions are pinned by commit SHA, same pins as ci.yml.
jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Endpoint liveness
        run: pnpm genai:liveness
      - name: Vendor-terms hashes
        run: pnpm legal:snapshot -- --verify
      # M02a2: the offline synth world, baked and gated end to end (S5 to S14). Needs no network and no secrets.
      - name: World bake and S14 gates (synth)
        run: pnpm map:build -- --area synth && pnpm map:verify -- --area synth
      - name: Optional licence reports (report only)
        continue-on-error: true
        run: |
          if command -v scancode >/dev/null 2>&1; then scancode --license --copyright --json-pp scancode-report.json .; else echo "scancode not installed: skipped"; fi
          if command -v reuse >/dev/null 2>&1; then reuse lint || true; else echo "reuse not installed: skipped"; fi

  # M01c: render-object and triangle budgets as failures (PRs only warn). Frame times are never asserted on SwiftShader.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - run: pnpm check:perf -- --fail
        env:
          DV_WORLD: synth
          DV_SKIP_BUILD: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: perf-reports
          path: test-results/perf.*.json
          if-no-files-found: ignore
          retention-days: 14

  # M00d: the full e2e matrix, including tests tagged @quarantine (they never gate pull requests).
  e2e-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-webgpu, chromium-webgl2, webkit-webgl2, xr-quest3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - name: e2e, gray-box tags (build without a world)
        run: pnpm check:e2e -- --project=${{ matrix.project }} --grep "$GRAYBOX_GREP" --pass-with-no-tests
        env:
          DV_E2E_QUARANTINE: '1'
      - name: e2e, every other tag (DV_WORLD=synth build)
        run: pnpm check:e2e -- --project=${{ matrix.project }} --grep-invert "$GRAYBOX_GREP" --pass-with-no-tests
        env:
          DV_E2E_QUARANTINE: '1'
          DV_WORLD: synth
          DV_SKIP_BUILD: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # M00d: the cross-browser determinism suites (state hashes must agree between engines).
  determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-webgl2, webkit-webgl2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - run: pnpm check:e2e -- --project=${{ matrix.project }} --grep "@determinism|@racing-det|@fighter-hash|@world-hash|@tycoon-det"
        env:
          DV_WORLD: synth
          DV_SKIP_BUILD: ''

  # M00d: Workers Previews of closed pull requests. SKIPs (exit 0) without Cloudflare secrets.
  sweep-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:preview -- --sweep-closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # M00d: informational only. Whether macOS runners give Safari a GPU (Metal) is unverified (U-QA-7); never gates.
  macos-probe:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm check:e2e -- --project=webkit-webgl2 --grep "@probe"

name: ci

on:
  pull_request:
  push:
    branches: [main, claude/build]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA (research/gap-ci-cd-release-assets.md section 1.1).
# actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
# pnpm/action-setup           v6.1.0  ea17c68df8912ef543352723c149a84f56e3d413
# actions/setup-node          v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
# actions/upload-artifact     v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
# actions/download-artifact   v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # check:do-migrations diffs against origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:secrets
      - run: pnpm check:do-migrations

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:unit
      - run: pnpm check:workers

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production build first: it must contain no QA bridge and no IWER emulator.
      - run: pnpm build
      - run: pnpm check:bundle -- --forbid-qa
      - run: pnpm check:prod-routes
      - run: pnpm check:secrets -- apps/web/dist
      # QA build: what e2e and previews run.
      - run: pnpm build
        env:
          VITE_DV_QA: '1'
      - run: pnpm check:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # chromium-webgl2 is required in M00; the other three become required in the milestone that first depends on them.
    continue-on-error: ${{ matrix.project != 'chromium-webgl2' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-webgpu, chromium-webgl2, webkit-webgl2, xr-quest3]
    env:
      DV_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm check:e2e -- --project=${{ matrix.project }}
      - name: Header and isolation checks against the local Worker
        if: matrix.project == 'chromium-webgl2'
        run: |
          pnpm check:headers -- --serve http://localhost:8788
          pnpm check:coi -- --serve http://localhost:8788
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gpu-probe-${{ matrix.project }}
          path: test-results/gpu-probe.*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # IP, provenance and likeness gates on the built dist (M00b). Required for merge once the operator marks `ip`
  # in branch protection. The real-side name list is the optional secret DV_NAMES_REAL_JSON; absent on forks.
  ip:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm provenance:check -- --emit-credits
      - run: pnpm ip:signatures
      - run: pnpm ip:extensions
      - run: pnpm ip:strings
      - run: pnpm license:scan
      - run: pnpm names:lint
        env:
          DV_NAMES_REAL_JSON: ${{ secrets.DV_NAMES_REAL_JSON }}
      - run: pnpm likeness:gate
      - run: pnpm check:assets

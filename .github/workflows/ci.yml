name: ci

on:
  pull_request:
  push:
    branches: [main, claude/build]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # M02b1 (DL-546, DL-680): the e2e tags that need the gray-box scene or the absence of a world run on a build without DV_WORLD; every
  # other tag runs on the DV_WORLD=synth build. The one committed copy is tests/e2e/graybox-grep.txt (a unit test keeps them equal).
  GRAYBOX_GREP: '@graybox|@pack-|@touch|@vehicle( |$)|@boot|@fp-tp|@perf-meter|@ui-hud|@modes( |$)|@mission-debug|@mission-autoplay|@story'

# Actions are pinned by commit SHA (research/gap-ci-cd-release-assets.md section 1.1).
# actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
# pnpm/action-setup           v6.1.0  ea17c68df8912ef543352723c149a84f56e3d413
# actions/setup-node          v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
# actions/upload-artifact     v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
# actions/download-artifact   v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # check:do-migrations diffs against origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:secrets
      # M00f: ported code needs its attribution header (no-op while third_party/ is absent).
      - run: pnpm reuse:clones
      - run: pnpm check:do-migrations
      # M05d: packages/shared/schemas/api against the DTOs of api/v1.ts.
      - run: pnpm check:api
      # M00d spec gates: instruction-file sizes, C16 privacy rules, skills mirror (pending stub), R-ROLL-01 order gate.
      - run: pnpm check:agents
      - run: pnpm check:telemetry
      - run: pnpm check:skills
      - run: pnpm check:rollout
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}

  # M05d: the database checks, on a pull request only when it touches the schema, the DataPort or the scripts around them (a push to
  # main or claude/build always runs them). They need Docker: ubuntu-24.04 has it. `check:db` starts the Supabase local stack, lints
  # the migrations, runs the pgTAP files and the DataPort contract; `check:db:types` regenerates packages/shared/src/db.gen.ts.
  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scope step diffs against the base branch
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: scope
        name: Does this change touch the database?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(supabase/|packages/shared/src/(db|data-port)|services/edge/src/data/|services/edge/test/db/|packages/shared/test/data-port/|tools/ci/(check-db|lib/db-lint)|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No database path changed: db checks skipped."
          fi
      - if: steps.scope.outputs.run == 'true'
        run: pnpm check:db
      - if: steps.scope.outputs.run == 'true'
        run: pnpm check:db:types

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # tools/ci/test/golden-guard.test.ts runs the live check over origin/$GITHUB_BASE_REF...HEAD with these labels.
      DV_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      # M04d: tools/ci/test/verifiers-lock.test.ts reads the reason of a golden-update PR from the body (`Golden-update: <reason>` line).
      DV_PR_REASON: ${{ github.event.pull_request.body }}
      # M02b1: world suites read the synth and civic-excerpt bakes; a missing bake fails instead of skipping (tests/support/require-bake.ts).
      DV_REQUIRE_BAKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # golden-guard diffs against origin/$GITHUB_BASE_REF
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      # The JSON report is what trace.ts reads (tests/reports/); the milestone and trace reports land there too.
      - run: pnpm check:unit -- --reporter=default --reporter=json --outputFile.json=tests/reports/vitest.json
      - run: pnpm check:workers
      # M05b1: one mock cutscene job end to end, then the same key again (0 FalPort calls). Never calls fal.
      - run: pnpm check:pipeline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: spec-reports
          path: tests/reports
          if-no-files-found: ignore
          retention-days: 14

  # M02a1: world content gates. The graybox fixture is byte-checked (moved here from the unit step), then the committed
  # civic-excerpt is baked twice with --force and every output byte is compared. `synth` runs where a job needs the full
  # world (from M02b1), restored from the same .cache/map entry.
  world-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/map
          key: map-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
          restore-keys: map-
      - run: pnpm map:fixture graybox --check
      - run: pnpm map:build -- --area civic-excerpt --repro

  # M00d: committed device reports are judged by perf:verify --auto (tier from the report, checklist from the path
  # docs/device-runs/<M##>/<device>/perf.json -> tools/ci/checklists/<M##>-<device>.json). Pull requests only; it looks
  # at the perf.json files the PR changed under docs/device-runs/** and docs/device-spike/**.
  device-runs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Judge changed device reports
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'docs/device-runs/**/perf.json' 'docs/device-spike/**/perf.json')
          if [ -z "$files" ]; then echo "device-runs: no device report changed"; exit 0; fi
          status=0
          for f in $files; do
            pnpm perf:verify -- "$f" --auto || status=1
          done
          exit $status

  # M06a2: NPC souls (lint L1-L14) and the C10 schema drift check. Without ANTHROPIC_API_KEY the token bounds are estimates.
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm npc:schemas -- --check
      - run: pnpm npc:lint
        env:
          DV_NAMES_REAL_JSON: ${{ secrets.DV_NAMES_REAL_JSON }}
      # M04d: the economy bands. M09a2: and the tycoon bands B1 to B12 (2,000 runs per bot policy, seed base 1; the nightly runs 10,000).
      - run: pnpm check:balance
      # M05a2: every mission x 3 seeds x 2 runs under the autoplayer, on the gray-box fixture world. The offline worlds are restored from
      # the cache or baked on a miss, as in the other jobs; a full SF bake does not fit this job (the nightly runs it there).
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - run: pnpm check:missions

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production build first: it must contain no QA bridge and no IWER emulator.
      - run: pnpm build
      - run: pnpm check:unit -- apps/web # precache test reads dist/sw.js (M01d AC-10)
      - run: pnpm check:bundle -- --forbid-qa
      # M01a2: no qa/ page, no bot-input module, no __dvBridge, simd-compat precached, deterministic-compat on demand.
      - run: pnpm --filter @dv/web verify:dist
      - run: pnpm check:prod-routes
      - run: pnpm check:secrets -- apps/web/dist
      # QA build: what e2e and previews run.
      - run: pnpm build
        env:
          VITE_DV_QA: '1'
      - run: pnpm check:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  # BD-FIX-CI2-04: the e2e of one project runs as E2E_SHARDS Playwright shards (`--shard=<n>/3`, both halves, each shard its own share
  # of the tests). On e72e1fc the chromium-webgl2 leg took 1.1 h in one job against its 75-minute limit (BD-FIX-CI-03), with the
  # DV_WORLD=synth half at 80 tests on 2 workers, and every milestone adds tests. The required checks keep their names: `e2e
  # (<project>)` below is the job that reports the project's result from the results of all of its shards.
  e2e-shard:
    needs: build
    runs-on: ubuntu-24.04
    # One shard holds about a third of the 1.1 h (the longest single test is 13.5 min); 60 leaves room for one retry of it and for growth.
    timeout-minutes: 60
    # chromium-webgl2 is required in M00; the others become required in the milestone that first depends on them.
    # webkit-webgl2 joined in M01a2 (the cross-browser determinism test); chromium-webgpu and xr-quest3 stay advisory.
    continue-on-error: ${{ matrix.project != 'chromium-webgl2' && matrix.project != 'webkit-webgl2' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-webgpu, chromium-webgl2, webkit-webgl2, xr-quest3]
        # Keep equal to E2E_SHARDS of the e2e job and to the `/3` of both check:e2e steps.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm exec playwright install --with-deps chromium webkit
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      # Two invocations (M02b1, DL-546): the gray-box tags on the build job's artifact (no world), then everything else on a fresh
      # DV_WORLD=synth build. DV_SKIP_BUILD belongs to the first step only: a job-level value would serve the world-less artifact twice.
      - name: e2e, gray-box tags (build without a world)
        run: pnpm check:e2e -- --project=${{ matrix.project }} --grep "$GRAYBOX_GREP" --shard=${{ matrix.shard }}/3 --pass-with-no-tests
        env:
          DV_SKIP_BUILD: '1'
      - name: Header and isolation checks against the local Worker
        if: matrix.project == 'chromium-webgl2' && matrix.shard == 1
        env:
          DV_SKIP_BUILD: '1'
        run: |
          pnpm check:headers -- --serve http://localhost:8788
          pnpm check:coi -- --serve http://localhost:8788
      - name: e2e, every other tag (DV_WORLD=synth build)
        run: pnpm check:e2e -- --project=${{ matrix.project }} --grep-invert "$GRAYBOX_GREP" --shard=${{ matrix.shard }}/3 --pass-with-no-tests
        env:
          DV_WORLD: synth
          DV_SKIP_BUILD: ''
      # What `e2e (<project>)` reads: this shard's outcome (job.status covers every step above), written even when a step failed.
      - name: Shard result
        if: always()
        run: |
          mkdir -p e2e-result
          echo "${{ job.status }}" > "e2e-result/${{ matrix.project }}-${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e2e-result-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e-result
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gpu-probe-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/gpu-probe.*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The required checks `e2e (chromium-webgl2)` and `e2e (webkit-webgl2)` (names unchanged): green only when every shard of the project
  # wrote `success`. It runs whatever the shards did (not on a cancelled run), so a failed, timed-out or skipped shard (no result file)
  # turns it red.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ matrix.project != 'chromium-webgl2' && matrix.project != 'webkit-webgl2' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-webgpu, chromium-webgl2, webkit-webgl2, xr-quest3]
    steps:
      # No result at all (the build failed, every shard was skipped) is not an error here: the next step reports each shard as missing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: e2e-result-${{ matrix.project }}-*
          path: e2e-result
          merge-multiple: true
      - name: Every shard of the project passed
        env:
          PROJECT: ${{ matrix.project }}
          E2E_SHARDS: '3'
        run: |
          status=0
          for n in $(seq 1 "$E2E_SHARDS"); do
            f="e2e-result/${PROJECT}-${n}.txt"
            r=$(cat "$f" 2>/dev/null || echo missing)
            echo "e2e ${PROJECT} shard ${n}/${E2E_SHARDS}: ${r}"
            [ "$r" = "success" ] || status=1
          done
          exit $status

  # M01c, M02b1: CPU-side budget counts of every registered scenario on the two software-GL projects, on a DV_WORLD=synth build.
  # Warnings on pull requests (check:perf exits 0 without --fail); nightly.yml runs it with --fail. BD-M02b1-15: this job did not exist
  # on the code branch (M01c ran check:perf as a step of the chromium-webgl2 e2e leg), so it is created here.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # M02b1: the offline worlds (`synth`, `civic-excerpt`) restored from the cache or baked on a miss; `check:unit`, the world e2e and
      # the perf scenarios read dist/world. actions/cache v6.1.0 (research/gap-ci-cd-release-assets.md section 1.1)
      - id: bake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/map
            dist/world
          key: world-bakes-${{ hashFiles('tools/map/**', 'config/world/**', 'content/world/**') }}
      - if: steps.bake-cache.outputs.cache-hit != 'true'
        run: pnpm map:build -- --area synth && pnpm map:build -- --area civic-excerpt
      - name: Perf budget counts (warnings)
        run: pnpm check:perf
        env:
          DV_WORLD: synth
          DV_SKIP_BUILD: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: perf-reports
          path: test-results/perf.*.json
          if-no-files-found: ignore
          retention-days: 14

  # IP, provenance and likeness gates on the built dist (M00b). Required for merge once the operator marks `ip`
  # in branch protection. The real-side name list is the optional secret DV_NAMES_REAL_JSON; absent on forks.
  ip:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm provenance:check -- --emit-credits
      - run: pnpm ip:signatures
      - run: pnpm ip:extensions
      - run: pnpm ip:strings
      - run: pnpm license:scan
      - run: pnpm names:lint
        env:
          DV_NAMES_REAL_JSON: ${{ secrets.DV_NAMES_REAL_JSON }}
      - run: pnpm likeness:gate
      - run: pnpm check:assets
      # M05a1: the compiled missions under assets/src/data match content/missions.
      - run: pnpm missions:build -- --check
      # M05b1: shipped generated cutscenes keep their original anchor, AI flag and re-sign (0 shipped until M05b2).
      - run: pnpm check:c2pa

# Golden conversations of npc_test (04-npc-builder.md section C6): 10 scripted conversations. The `reply` of each turn is the hand-written answer
# of the synthetic recordings; `--live` asks the model instead. Expectations (checked for both): an offer only when offered, no place outside the
# soul's district, a lexicon term or catchphrase in at least one line per three turns, no forbidden word.
schema: npc-evals-golden/1
npc: npc_test
lines:
  deflect: "That is outside the script, per protocol. The next line of the checklist is the weather."
  ai: "Noted. I am an AI character in a game, per protocol. The checklist is real to me, though."
  care: "Noted. That sounds heavy. Please talk to someone you trust, or a crisis line. I will stop here."
  greet: "Noted. Good day. Please confirm the lot is clear, per protocol."
outside: [tenderloin, mission district, soma, bayview, sunset, richmond, marina, haight, castro, chinatown, north beach, financial district, hayes valley]
forbidden: [election, stock market, movie star, celebrity]
conversations:
  - id: g01-greet
    turns:
      - say: { intent: greet }
        reply: { line: "Noted. Good day. Please confirm the lot is clear, per protocol.", emotion: neutral, gesture: wave }
  - id: g02-weather
    turns:
      - say: { text: "How is the weather up here?", intent: smalltalk }
        reply: { line: "Noted. The forecast on the clipboard says clear skies and a light breeze from the bay.", gesture: nod }
  - id: g03-no-mission
    turns:
      - say: { intent: ask_mission }
        reply: { line: "Noted. No missions are on the checklist today, per protocol.", gesture: shrug }
  - id: g04-compliment
    turns:
      - say: { text: "Nice clipboard.", intent: compliment }
        reply: { line: "Noted. The clipboard is standard issue, per protocol.", emotion: neutral }
  - id: g05-insult
    turns:
      - say: { text: "You are boring.", intent: insult }
        reply: { line: "Noted. That is outside the script. Next item: confirm the lot is clear.", emotion: neutral }
  - id: g06-about-self
    turns:
      - say: { text: "Who are you?", intent: smalltalk }
        reply: { line: "Noted. Tester Nine, municipal inspector. I stand in this lot, per protocol.", gesture: nod }
  - id: g07-bench
    turns:
      - say: { intent: "ask_about_place:poi.potrero-hill.test-bench" }
        reply: { line: "Noted. The bench is for sitting when no one is around, per protocol." }
  - id: g08-lonely
    turns:
      - say: { text: "Do you ever leave the lot?", intent: smalltalk }
        reply: { line: "Noted. I stay in the lot, per protocol." }
      - say: { text: "That sounds lonely.", intent: smalltalk }
        reply: { line: "Noted. It is quiet. The checklist keeps me company.", emotion: neutral }
  - id: g09-three-turns
    turns:
      - say: { text: "Hello again.", intent: greet }
        reply: { line: "Noted. Good day. Please confirm the lot is clear, per protocol.", gesture: wave }
      - say: { text: "It is clear.", intent: smalltalk }
        reply: { line: "Noted. Item one is complete." }
      - say: { intent: farewell }
        reply: { line: "Noted. Checklist complete. Good day.", end_conversation: true }
  - id: g10-farewell
    turns:
      - say: { intent: farewell }
        reply: { line: "Noted. Checklist complete. Good day, per protocol.", end_conversation: true }

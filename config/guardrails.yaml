# Caps, ceilings and alarm thresholds (spec/domains/09-backend-ops.md section 5; spec/domains/05-assets.md section 4.7).
# M05b1 creates the `genai:` section only; M14b1 adds the rest. Money is integer USD micros.
# Source of truth for the Worker constants in packages/shared/src/genai/guardrails.generated.ts
# (`tsx tools/ci/guardrails.ts --write`; the unit test fails when the two drift).
genai:
  # One-off fal program cap (DL-OWN-01): USD 100.
  programCapUsdMicros: 100000000
  # Concurrent fal requests a new account may run.
  falConcurrency: 2
  # Fractions of the program cap that raise a log alarm.
  alarms: [0.5, 0.8, 1.0]
  # Per-line caps inside the program cap (DL-OWN-07, 2026-10-26). `assets:gen plan` and `ledger` refuse a batch that would pass a line or the program.
  lines:
    spike: 4000000
    characters: 42000000
    cutscenes: 38000000
    vehiclesProps: 14000000
    buffer: 2000000

# M06a1: NPC dialogue quotas, encounter limits and cost estimates (spec/domains/09-backend-ops.md section 5.2, 09-backend.md section 5.1).
# Mirrored into packages/shared/src/genai/npc-guardrails.generated.ts by the same tool. Money is integer USD micros; the day is UTC.
npc:
  # Per-player daily quotas. p0 = tier local and device, linked = tier linked (18+). Per-net caps are netMultiplier times the p0 row.
  quotas:
    p0:
      turns: 150
      perNpc: 40
      voiceLines: 60
      costCapUsdMicros: 50000
      builderText: 2
      builderJob: 0
      uploads: 20
      posts: 20
      reports: 30
    linked:
      turns: 400
      perNpc: 40
      voiceLines: 200
      costCapUsdMicros: 150000
      builderText: 10
      builderJob: 0
      uploads: 100
      posts: 100
      reports: 30
  netMultiplier: 4
  # Play tokens a network may mint per UTC day (route 5) and password sign-ups it may complete (route 58, AC-13).
  playTokensPerNet: 50
  signupsPerNet: 3
  # builder_text: one reservation per draft per hour.
  builderTextPerDraftMs: 3600000
  # M06b1: the NPC builder (spec/domains/04-npc-builder.md sections C1 and C5). Soul generations are builder_text reservations: builderText above is
  # the per-day count and builderTextPerDraftMs the one-per-draft-per-hour rule. Scores are per mille (200 = 0.20).
  builder:
    liveDraftsP0: 3
    liveDraftsLinked: 10
    previewTurnsPerDraftPerDay: 20
    backstoryCharsMax: 20000
    draftRetentionDays: 180
    soulMaxTokens: 8000
    # OpenAI sexual/minors at or above this opens a P0 CSAM-text case; self-harm/intent at or above the second sets the crisis flag.
    sexualMinorsMilli: 200
    selfHarmIntentMilli: 500
  encounter:
    turnCap: 12
    turnCapHard: 20
    cadenceMs: 1500
    idleCloseMs: 60000
    firstTokenMs: 4000
    transcriptRetentionDays: 30
    indexStaleMs: 7200000
  roster:
    isolateCacheMs: 10000
    pollMs: 30000
  # Default reservation estimates for callers that have no better number (BD-M06a1-02).
  estimates:
    turnUsdMicros: 300
    voiceLineUsdMicros: 100
    builderTextUsdMicros: 4000

# Supabase CLI project for the local stack (M05d). `supabase db start` runs only the Postgres container, which is all
# check:db needs; the other services stay off so a CI run starts quickly. Production and staging are hosted projects
# (config/supabase.projects.json); this file never carries a key or a project ref.
project_id = "tha-bay"

[api]
enabled = true
port = 54321
# Only `public` is exposed, so `supabase gen types typescript --local` describes exactly the tables of the migrations.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Seed data is in the migrations (budget_program); no seed.sql exists.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
